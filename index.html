<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Free Online Tools - Age, BMI, Password Generator & More</title><meta name="description" content="Free online tools - Age Calculator, BMI, Password Generator, Word Counter, QR Code"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#f5f7fb}header{background:#111827;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:800;font-size:20px}nav a{color:#9ca3af;text-decoration:none;margin-left:12px;font-size:13px}.wrap{max-width:800px;margin:20px auto;padding:0 14px}.hero{text-align:center;padding:18px;background:#fff;border-radius:16px;margin-bottom:16px;box-shadow:0 4px 12px rgba(0,0,0,.05)}h1{font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tool{background:#fff;border-radius:14px;padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.05);text-align:center;cursor:pointer}.tool h3{font-size:15px;margin-top:6px}.tool p{font-size:11px;color:#6b7280;margin-top:4px}.card{background:#fff;border-radius:16px;padding:22px;margin-top:16px;box-shadow:0 4px 12px rgba(0,0,0,.05)}input,select{width:100%;padding:12px;border:2px solid #e5e7eb;border-radius:10px;margin-top:10px;font-size:16px}.btn{width:100%;margin-top:12px;background:#2563eb;color:#fff;border:0;padding:13px;border-radius:10px;font-weight:700;font-size:16px}#res{margin-top:14px;padding:14px;background:#eff6ff;border-radius:10px;text-align:center;font-weight:600;display:none}</style></head><body><header><div class="logo">MyTools.ug</div><nav><a href="#">Tools</a><a href="#">About</a></nav></header><div class="wrap"><div class="hero"><h1>Free Online Tools</h1><p style="color:#6b7280;font-size:13px;margin-top:4px">6 useful tools for everyday use</p></div><div class="grid"><div class="tool" onclick="show('age')"><div style="font-size:26px">🎂</div><h3>Age Calculator</h3><p>Exact age</p></div><div class="tool" onclick="show('bmi')"><div style="font-size:26px">⚖️</div><h3>BMI Calculator</h3><p>Body mass</p></div><div class="tool" onclick="show('pass')"><div style="font-size:26px">🔐</div><h3>Password Gen</h3><p>Strong pass</p></div><div class="tool" onclick="show('word')"><div style="font-size:26px">📝</div><h3>Word Counter</h3><p>Count words</p></div></div><div id="age" class="card"><h2>Age Calculator</h2><input id="am" type="number" placeholder="Month 1-12"><input id="ad" type="number" placeholder="Day 1-31"><input id="ay" type="number" placeholder="Year e.g. 2000"><button class="btn" onclick="calcAge()">Calculate</button><div id="r1"></div></div><div id="bmi" class="card" style="display:none"><h2>BMI Calculator</h2><input id="h" type="number" placeholder="Height in cm e.g. 170"><input id="w" type="number" placeholder="Weight in kg e.g. 70"><button class="btn" onclick="calcBmi()">Calculate BMI</button><div id="r2"></div></div><div id="pass" class="card" style="display:none"><h2>Password Generator</h2><select id="len"><option value="12">12 Characters</option><option value="16">16 Characters</option><option value="8">8 Characters</option></select><button class="btn" onclick="genPass()">Generate Password</button><div id="r3"></div></div><div id="word" class="card" style="display:none"><h2>Word Counter</h2><textarea id="txt" style="width:100%;height:100px;padding:12px;border:2px solid #e5e7eb;border-radius:10px" placeholder="Type or paste text..."></textarea><button class="btn" onclick="countWord()">Count</button><div id="r4"></div></div></div><script>function show(id){document.querySelectorAll('.card').forEach(c=>c.style.display='none');document.getElementById(id).style.display='block';window.scrollTo(0,300)}function calcAge(){let m=+am.value,d=+ad.value,y=+ay.value;if(!m||!d||!y)return alert('Fill all');let b=new Date(y,m-1,d),n=new Date();if(b>n)return alert('Future');let Y=n.getFullYear()-b.getFullYear(),M=n.getMonth()-b.getMonth(),D=n.getDate()-b.getDate();if(D<0){M--;D+=new Date(n.getFullYear(),n.getMonth(),0).getDate()}if(M<0){Y--;M+=12}r1.innerHTML='<div id=res style=display:block><h2 style=color:#2563eb>'+Y+' Years</h2><p>'+M+' Months '+D+' Days</p></div>'}function calcBmi(){let H=+h.value/100,W=+w.value;if(!H||!W)return alert('Fill');let B=(W/(H*H)).toFixed(1);let s=B<18.5?'Underweight':B<25?'Normal':B<30?'Overweight':'Obese';r2.innerHTML='<div id=res style=display:block>Your BMI: <b>'+B+'</b><br>'+s+'</div>'}function genPass(){let l=+len.value,c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#$%',p='';for(let i=0;i<l;i++)p+=c[Math.floor(Math.random()*c.length)];r3.innerHTML='<div id=res style=display:block><b style=font-size:20px>'+p+'</b><br><button onclick=navigator.clipboard.writeText(`'+p+'`) style=margin-top:8px;padding:6px 12px;border-radius:6px;border:1px solid #ddd>Copy</button></div>'}function countWord(){let t=txt.value.trim();let w=t?t.split(/\s+/).length:0;let ch=t.length;r4.innerHTML='<div id=res style=display:block>'+w+' Words<br>'+ch+' Characters</div>'}</script></body></html>
